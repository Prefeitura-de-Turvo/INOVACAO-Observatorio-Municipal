services:
  observatorio:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/observatorio.sqlite3
    volumes:
      - observatorio-data:/app/data
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      - observatorio
    restart: unless-stopped
volumes:
  observatorio-data:
