[project]
name = "observatorio-turvo"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp-brasil", "httpx>=0.27", "python-dotenv>=1", "pydantic>=2", "openpyxl>=3.1,<4"]
[tool.uv.sources]
mcp-brasil = { git = "https://github.com/Mcp-Brasil/mcp-brasil.git", rev = "2efb258370b125bbf190884283ae10f209b9d335" }
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]
